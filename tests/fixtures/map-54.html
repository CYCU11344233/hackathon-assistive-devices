#wrapper {

}

#textContent {
	width: 146px;
	float: left;
	margin: 80px 0 0 0;

.gwd-div-tr3l {
	width: 124px;
	border: solid 3px #2CC28B;
	padding: 4px 8px;
	font-size: 15px;
	margin: 0 0 18px 0;
	cursor:pointer;
	background-color: #fff;
	position: relative;
	z-index: 99;
}

.gwd-div-tr3l p {
	border-bottom: solid 2px #2cc28B;
	text-align: center;
	padding: 5px 0;
	margin: 0 0 8px 0;
	font-size: 18px;
}

.gwd-div-tr3l span {
	display: block;
	width: 100%;
	margin: 10px 0 5px 0;
}

.gwd-div-tr3l.gwd-div-f7jb {
	border: solid 3px #7BD712;
}

.gwd-div-tr3l.gwd-div-f7jb p {
	border-bottom: solid 2px #7BD712;
}

.gwd-div-tr3l.gwd-div-eh9c {
	border: solid 3px #E9E80B;
}

.gwd-div-tr3l.gwd-div-eh9c p {
	border-bottom: solid 2px #E9E80B;
}

#mapContent {
	/*width: 415px;*/
	width: calc(100% - 146px);
	float: left;
	height: 600px;
	position: relative;
}


@media (max-width: 510px) {
	#wrapper {
		transform: scale(.75);
		left: -20px;
	}
}
@media (max-width: 415px) {
	#wrapper {
		transform: scale(.6);
		left: -50px;
	}
}
@media (max-width: 375px) {
	#wrapper {
		transform: scale(.5);
		left: -50px;
        top: -15px;
	}
}

.map {
	width: 415px;
	height: 545px;
	background: url(/app37/newmap/map.png) no-repeat 0px 0px;

}

.map01_hv {
	width: 415px;
	height: 545px;
	background: url(/app37/newmap/map01_hv.png) no-repeat 0px 0px;
	-webkit-transition: all 0.2s ease-in;
	-moz-transition:  all 0.2s ease-in;
	transition: all 0.2s ease-in;
}

.map02_hv {
	width: 415px;

.sr-only {
	border: 0;
	clip: rect(0, 0, 0, 0);
	height: 1px;
	margin: -1px;
	overflow: hidden;
	padding: 0;
	position: absolute;
	width: 1px;
}
.map-link{
	transition: all .3s;
	text-align: center;
}
.map-link:focus, .map-link:hover{
	color: #e75151;
}
